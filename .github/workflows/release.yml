name: Release

# ════════════════════════════════════════════════════════════════
# 公开构建仓库：本仓库不含任何业务代码。
# 触发后通过只读 Deploy Key 克隆私有 monorepo，在其中构建并回本仓库发 Release。
#
# 发版顺序（重要）：
#   1. 在私有仓库打 tag 并推送：git tag v0.3.2 && git push github v0.3.2
#   2. 在本仓库打同名 tag 并推送（触发本 workflow）
#
# 安全守则（勿违反）：
#   - 触发器只允许 push tags，禁止引入 pull_request_target
#   - 本仓库不添加任何 collaborator
#   - PRIVATE_DEPLOY_KEY 对应的 Deploy Key 在私有仓库侧必须保持只读
# ════════════════════════════════════════════════════════════════

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PRIVATE_REPO: git@github.com:ayongbox/docclear-private.git

jobs:
  # ── 版本校验 ──
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Setup SSH for private repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}

      - name: Clone private source
        working-directory: .
        run: git clone --depth 1 --branch ${{ github.ref_name }} "${{ env.PRIVATE_REPO }}" src

      - name: Version files consistency
        run: bash scripts/version.sh check

      - name: Tag matches Cargo.toml
        run: |
          CARGO_VERSION=$(grep -E '^version\s*=' Cargo.toml | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Cargo.toml version ($CARGO_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version: $CARGO_VERSION (tag: $TAG_VERSION)"

  # ── CLI 构建 + 打包（5 目标）──
  build:
    name: Build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: docclear-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: docclear-aarch64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: docclear-x86_64-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: docclear-aarch64-linux-gnu
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: docclear-x86_64-windows

    defaults:
      run:
        working-directory: src

    steps:
      - name: Setup SSH for private repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}

      - name: Clone private source
        working-directory: .
        run: git clone --depth 1 --branch ${{ github.ref_name }} "${{ env.PRIVATE_REPO }}" src

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          workspaces: src

      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }} -p docclear-cli -p docclear-mcp -p docclear-web
        env:
          RUSTFLAGS: "-C link-arg=-s"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package/docclear/bin
          mkdir -p package/docclear/plugins/redaction-rules
          mkdir -p package/docclear/scripts

          cp target/${{ matrix.target }}/release/docclear package/docclear/bin/docclear
          cp target/${{ matrix.target }}/release/docclear-mcp package/docclear/bin/docclear-mcp
          cp target/${{ matrix.target }}/release/docclear-web package/docclear/bin/docclear-web
          cp plugins/redaction-rules/*.yaml package/docclear/plugins/redaction-rules/
          cp scripts/*.sh package/docclear/scripts/ 2>/dev/null || true

          cd package
          tar czf ../${{ matrix.artifact }}.tar.gz docclear/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p package/docclear/bin
          mkdir -p package/docclear/plugins/redaction-rules

          cp target/${{ matrix.target }}/release/docclear.exe package/docclear/bin/
          cp target/${{ matrix.target }}/release/docclear-mcp.exe package/docclear/bin/
          cp target/${{ matrix.target }}/release/docclear-web.exe package/docclear/bin/
          cp plugins/redaction-rules/*.yaml package/docclear/plugins/redaction-rules/

          cd package
          7z a ../${{ matrix.artifact }}.zip docclear/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src/${{ matrix.artifact }}.*

  # ── Linux 桌面安装包（.deb / .AppImage）──
  desktop-linux:
    name: Desktop Linux (.deb/AppImage)
    needs: validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src
    steps:
      - name: Setup SSH for private repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}

      - name: Clone private source
        working-directory: .
        run: git clone --depth 1 --branch ${{ github.ref_name }} "${{ env.PRIVATE_REPO }}" src

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-desktop-linux
          workspaces: src

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev \
            file patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm and frontend deps
        run: |
          npm install -g pnpm@11
          cd apps/desktop
          pnpm install --frozen-lockfile

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build .deb and .AppImage
        run: cargo tauri build --bundles deb appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docclear-linux-desktop
          path: |
            src/target/release/bundle/deb/*.deb
            src/target/release/bundle/appimage/*.AppImage

  # ── macOS 桌面安装包（.dmg，universal 双架构，ad-hoc 签名）──
  desktop-macos:
    name: Desktop macOS (.dmg)
    needs: validate
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Setup SSH for private repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}

      - name: Clone private source
        working-directory: .
        run: git clone --depth 1 --branch ${{ github.ref_name }} "${{ env.PRIVATE_REPO }}" src

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-desktop-macos
          workspaces: src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm and frontend deps
        run: |
          npm install -g pnpm@11
          cd apps/desktop
          pnpm install --frozen-lockfile

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build universal .dmg
        run: cargo tauri build --target universal-apple-darwin --bundles dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docclear-macos-desktop
          path: src/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # ── Windows 桌面安装包（NSIS .exe）──
  # 注：MSI（WiX light.exe）在 windows runner 上失败且无错误输出，疑与磁盘空间/大资源
  # cab 压缩有关；NSIS 是 Tauri 2 官方推荐方案，未签名分发场景与 MSI 无差别，故只用 nsis
  desktop-windows:
    name: Desktop Windows (.exe)
    needs: validate
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Setup SSH for private repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}

      - name: Clone private source
        working-directory: .
        run: git clone --depth 1 --branch ${{ github.ref_name }} "${{ env.PRIVATE_REPO }}" src

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-desktop-windows
          workspaces: src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm and frontend deps
        run: |
          npm install -g pnpm@11
          cd apps/desktop
          pnpm install --frozen-lockfile

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build NSIS installer
        run: cargo tauri build --bundles nsis

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docclear-windows-desktop
          path: src/target/release/bundle/nsis/*.exe

  # ── 创建 GitHub Release（建在本公开仓库，产物公开可下载）──
  release:
    name: Create Release
    needs: [build, desktop-linux, desktop-macos, desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
